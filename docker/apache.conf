# Apache 2.4 virtual host for the container - the single source of Apache config.

<VirtualHost *:80>
    ServerName localhost

    # Only public/ is web-reachable; src/, config/, storage/ never are.
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride None
        Options +FollowSymLinks -Indexes
        Require all granted
        DirectoryIndex index.html

        RewriteEngine On

        # /media serves images only (uploads are always written with an image extension).
        RewriteCond %{REQUEST_URI} ^/media/
        RewriteCond %{REQUEST_URI} !\.(jpe?g|png|webp)$ [NC]
        RewriteRule ^ - [F]

        # Pretty URLs for the static front end.
        RewriteRule ^products/search$                          search.html      [L]
        RewriteRule ^products/[^/]+$                           product.html     [L]
        RewriteRule ^(products|technical|company|contact)$     placeholder.html [L]
        RewriteRule ^admin/?$                                  admin/products.html [L]
        RewriteRule ^admin/(login|products|product-form)$      admin/$1.html [L]
        # Canonical admin URLs have no .html; redirect the file form (THE_REQUEST
        # is the original request line, so the internal rewrite above can't loop).
        RewriteCond %{THE_REQUEST} \s/admin/(login|products|product-form)\.html[\s?]
        RewriteRule ^ /admin/%1 [R=302,L]

        # Real files (pages, assets) are served as-is; everything else is the API.
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [L]

        <FilesMatch "^\.">
            Require all denied
        </FilesMatch>

        # Pages and scripts change between builds: make browsers revalidate
        # (304 when unchanged) instead of heuristically caching stale copies.
        <FilesMatch "\.(html|js|css)$">
            Header set Cache-Control "no-cache"
        </FilesMatch>
    </Directory>

    # Uploaded images live in storage/uploads and are exposed through the
    # public/media symlink. Match on the URL (a <Directory> on the symlink
    # target would never apply): static files only, never executed.
    <Location /media>
        php_flag engine off
        RemoveHandler .php .phtml .phar
        RemoveType .php .phtml .phar
        Header set X-Content-Type-Options "nosniff"
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
