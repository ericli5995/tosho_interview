# Apache 2.4 virtual host used inside the container.
# DocumentRoot is public/ so src/, config/, storage/ are never web-reachable.

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        # public/.htaccess drives the front-controller rewrite.
        AllowOverride All
        Options +FollowSymLinks -Indexes
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
