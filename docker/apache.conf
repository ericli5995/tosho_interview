# Apache 2.4 virtual host for the container - the single source of Apache config.

<VirtualHost *:80>
    ServerName localhost

    # Only public/ is web-reachable; src/, config/, storage/, sql/ never are.
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride None
        Options +FollowSymLinks -Indexes
        Require all granted
        DirectoryIndex index.html

        RewriteEngine On

        # /media -> storage/uploads (symlink): images only, never executed.
        RewriteCond %{REQUEST_URI} ^/media/
        RewriteCond %{REQUEST_URI} !\.(jpe?g|png|webp)$ [NC]
        RewriteRule ^ - [F]

        # Pretty URLs for the static pages.
        RewriteRule ^products/search$                          search.html      [L]
        RewriteRule ^products/[^/]+$                           product.html     [L]
        RewriteRule ^(products|technical|company|contact)$     placeholder.html [L]
        RewriteRule ^admin/?$                                  admin/products.html [L]
        RewriteRule ^admin/(login|products|product-form|users)$      admin/$1.html [L]
        RewriteCond %{THE_REQUEST} \s/admin/(login|products|product-form|users)\.html[\s?]
        RewriteRule ^ /admin/%1 [R=302,L]

        # Real files (pages, assets) are served as-is; everything else is the API.
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [L]

        # Pages change between builds: revalidate instead of caching stale copies.
        <FilesMatch "\.(html|js|css)$">
            Header set Cache-Control "no-cache"
        </FilesMatch>
    </Directory>

    <Location /media>
        php_flag engine off
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
